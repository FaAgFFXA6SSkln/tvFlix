name: Update Streaming URL

on:
  schedule:
    - cron: "*/15 * * * *"   # 15분마다
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # 🔥 이거 중요 (push 권한)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run script
        run: node scripts/update.js

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add main/main.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: update streaming url"
          git push
